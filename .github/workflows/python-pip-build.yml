name: Python pip build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Match the Python version used by the previous build workflow.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install build tools and declared dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine -r requirements.txt

      # The default build also builds the wheel from the source archive.
      - name: Build source distribution and wheel
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Install wheel and check dependencies
        run: |
          python -m pip install dist/*.whl
          python -m pip check

      # Run outside the checkout so imports must come from the installed wheel.
      - name: Smoke-test installed package and bundled data
        working-directory: ${{ runner.temp }}
        run: |
          apachetomcatscanner --help
          python -m apachetomcatscanner --help
          python - <<'PY'
          from apachetomcatscanner.Config import Config
          from apachetomcatscanner.VulnerabilitiesDB import VulnerabilitiesDB

          config = Config()
          assert config.credentials, "Default credentials are missing from the wheel"
          database = VulnerabilitiesDB(config=config, skip_auto_update=True)
          assert database.cves, "CVE data is missing from the wheel"
          assert database.versions_to_cves, "CVE version lookup is empty"
          print(f"Loaded {len(database.cves)} bundled CVEs")
          PY

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
